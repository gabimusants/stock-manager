services:
  postgres:
    image: postgres:16
    container_name: stock-manager-db
    environment:
      POSTGRES_DB: ${DB_NAME:-stockmanager}
      POSTGRES_USER: ${DB_USERNAME:-stockmanager_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
