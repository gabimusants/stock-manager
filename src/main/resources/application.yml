spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/${DB_NAME:stockmanager}
    username: ${DB_USERNAME:stockmanager_user}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
